# Declarative fallback for the zabbix system user/group.
#
# The zabbix-agent2 RPM only creates this user via an old-style %pre
# scriptlet (useradd/groupadd), not a sysusers.d file. That scriptlet does
# run during the image build, but on an already-deployed bootc/ostree host,
# /etc/passwd and /etc/group are locally-modified files (every real host
# diverges from a vanilla base image), so ostree's per-file /etc merge on
# upgrade keeps the LOCAL version and silently drops the newly-added zabbix
# line from the new image -- confirmed on cthun 2026-07-05: user genuinely
# absent after upgrade+reboot despite the RPM installing cleanly, agent
# crash-looping on ExecStartPre exit 217/USER (uid/gid lookup failure).
#
# systemd-sysusers runs at every boot (unlike a build-time scriptlet) and is
# idempotent, so this survives the /etc merge regardless of what happens to
# /etc/passwd itself. Matches the exact account the RPM scriptlet creates.
u zabbix - "Zabbix Monitoring System" /var/lib/zabbix /sbin/nologin
