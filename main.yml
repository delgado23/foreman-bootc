---
# main.yml — Weekly build, smoke-test, and push of the AlmaLinux 10 bootc images.
#
# Run by Ascender (job template "Build bootc Images Weekly") on a weekly schedule.
# It builds on the rootless `bootcbuild` user on nexus.garaventaville.com — the same
# host/user used for manual builds — by reusing the repo's build-push scripts (which
# build, smoke-test, and push). Each run rebuilds the pinned tags (to pick up upstream
# security/package updates under the version pin) AND publishes a dated tag so every
# weekly build is retained for rollback.
#
# Requires:
#   - vars/vault.yml  (Ansible Vault) providing registry_username / registry_password.
#     Encrypt with the vault password of the Ascender Vault credential attached to the
#     job template:  ansible-vault encrypt vars/vault.yml
#   - The connecting machine credential (e.g. "Ansible User") must be able to sudo to
#     `bootcbuild` on nexus, and `bootcbuild` must have lingering enabled so rootless
#     podman has a runtime dir:  loginctl enable-linger bootcbuild
- name: Weekly build, test, and push of the AlmaLinux 10 bootc images
  hosts: nexus.garaventaville.com
  gather_facts: true
  vars_files:
    - vars/vault.yml
  vars:
    bootc_build_user: bootcbuild
    repo_url: https://git.garaventaville.com/Garaventaville/foreman-bootc.git
    repo_version: main
    registry: foreman.garaventaville.com
    # almalinux10-bootc has no fixed tag — build-push.sh detects the AlmaLinux
    # release (e.g. 10.2) from the image and also pushes the floating :10 tag.
    k8s_tag: "1.35.5"     # kubernetes-* — matches K8S_VERSION / build-push-k8s.sh
  tasks:
    - name: Resolve the rootless build user (UID + home, for runtime dir / repo path)
      ansible.builtin.getent:
        database: passwd
        key: "{{ bootc_build_user }}"

    - name: Set build facts (runtime dir, weekly date tag, repo checkout path)
      ansible.builtin.set_fact:
        # Dedicated CI checkout — kept separate from the human's manual ~/build dir.
        bootc_runtime_dir: "/run/user/{{ ansible_facts.getent_passwd[bootc_build_user][1] }}"
        date_stamp: "{{ ansible_facts.date_time.date | regex_replace('-', '') }}"
        repo_dest: "{{ ansible_facts.getent_passwd[bootc_build_user][4] }}/foreman-bootc"

    - name: Build, test, and push as the rootless build user
      become: true
      become_user: "{{ bootc_build_user }}"
      environment:
        XDG_RUNTIME_DIR: "{{ bootc_runtime_dir }}"
      block:
        - name: Check out / update the build repo
          ansible.builtin.git:
            repo: "{{ repo_url }}"
            dest: "{{ repo_dest }}"
            version: "{{ repo_version }}"
            force: true

        - name: Log in to the Katello registry (rootless podman)
          ansible.builtin.command:
            cmd: "podman login --username {{ registry_username }} --password-stdin {{ registry }}"
            stdin: "{{ registry_password }}"
          no_log: true
          changed_when: true

        - name: Build, smoke-test, and push the base image (release + floating + dated tags)
          ansible.builtin.command:
            cmd: "./build-push.sh"   # auto-detects the AlmaLinux release as the tag
            chdir: "{{ repo_dest }}"
          environment:
            DATE_STAMP: "{{ date_stamp }}"   # publishes the :<release>-<date> snapshot
            SMOKE_PULL: "1"   # re-pull from the registry and re-check (promotion gate)
          changed_when: true

        - name: Build, smoke-test, and push the Kubernetes images (pinned + dated tags)
          ansible.builtin.command:
            cmd: "./build-push-k8s.sh {{ k8s_tag }}"
            chdir: "{{ repo_dest }}"
          environment:
            EXTRA_TAGS: "{{ k8s_tag }}-{{ date_stamp }}"
            SMOKE_PULL: "1"   # re-pull from the registry and re-check (promotion gate)
          changed_when: true
      always:
        - name: Log out of the Katello registry
          ansible.builtin.command:
            cmd: "podman logout {{ registry }}"
          changed_when: true
          failed_when: false

# This play only runs if the build/push/smoke play above succeeded — Ansible
# aborts the run on the first failed task, so a failed pull-back smoke test stops
# everything here BEFORE anything is promoted (Production keeps its prior good
# version). Publishing snapshots the freshly-pushed Library content into a new CV
# version; promoting it to Production is the gate that makes it installable.
#
# Targets nexus (NOT localhost): the job template runs with a --limit on the build
# host, and --limit filters every play — a `hosts: localhost` play matches nothing
# under it and silently skips. nexus is in the limit, and if the build play above
# failed nexus is marked failed so this play finds no host (the gate still holds).
# The Foreman API call itself is delegated to localhost (the execution environment,
# where the theforeman.foreman collection and network to Foreman live).
- name: Promote the smoke-tested bootc images to Production
  hosts: nexus.garaventaville.com
  gather_facts: false
  # Every task here calls the Foreman API from the execution environment (delegated
  # to localhost). The job template enables privilege escalation globally so the
  # build block can sudo to bootcbuild on nexus; none of these tasks need it and the
  # EE has no sudo — so disable become for the whole play.
  become: false
  vars_files:
    - vars/vault.yml
  vars:
    foreman_org: Garaventaville
    bootc_cv: bootc
    bootc_cv_keep: 3          # number of newest content view versions to retain
  module_defaults:
    theforeman.foreman.content_view_version:
      username: "{{ foreman_username }}"
      password: "{{ foreman_password }}"
      server_url: "{{ foreman_hostname }}"
      organization: "{{ foreman_org }}"
      validate_certs: false
    theforeman.foreman.resource_info:
      username: "{{ foreman_username }}"
      password: "{{ foreman_password }}"
      server_url: "{{ foreman_hostname }}"
      organization: "{{ foreman_org }}"
      validate_certs: false
  tasks:
    - name: Publish bootc content view and promote Library -> Production
      theforeman.foreman.content_view_version:
        content_view: "{{ bootc_cv }}"
        lifecycle_environments:
          - Library
          - Production
      delegate_to: localhost
      run_once: true

    # Retention: each publish creates a new CV version, and promoting the newest to
    # both environments orphans the previous one. Keep only the newest
    # `bootc_cv_keep` versions and delete the rest (oldest first) — but only versions
    # that are in NO lifecycle environment, so a version still serving Library or
    # Production is never removed.
    - name: Look up the bootc content view
      theforeman.foreman.resource_info:
        resource: content_views
        search: 'name = "{{ bootc_cv }}"'
      register: bootc_cv_info
      delegate_to: localhost
      run_once: true

    - name: List the bootc content view versions
      theforeman.foreman.resource_info:
        resource: content_view_versions
        params:
          content_view_id: "{{ bootc_cv_info.resources[0].id }}"
      register: bootc_cvv_info
      delegate_to: localhost
      run_once: true

    - name: Delete bootc content view versions beyond the newest {{ bootc_cv_keep }}
      theforeman.foreman.content_view_version:
        content_view: "{{ bootc_cv }}"
        version: "{{ item.version }}"
        state: absent
      loop: "{{ (bootc_cvv_info.resources | sort(attribute='id') | reverse)[bootc_cv_keep | int:] | selectattr('environments', 'equalto', []) | list }}"
      loop_control:
        label: "version {{ item.version }} (id {{ item.id }})"
      delegate_to: localhost
      run_once: true
