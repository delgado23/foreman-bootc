# Gitea Actions. Note that Gitea only reads .gitea/workflows, never .github/workflows.
#
# The foreman/ scripts run inside `foreman-rake console` on the Foreman server,
# which CI can't reach. CI syntax-checks all of them, and runs the scripts that
# have behaviour tests against the plain-Ruby fakes in tests/fake_foreman.rb.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ruby
        # Install explicitly rather than relying on whatever the runner image ships.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby
          ruby --version

      - name: Syntax-check the Foreman console scripts and tests
        run: |
          for f in foreman/*.rb foreman/ops/*.rb tests/*.rb; do
            ruby -c "$f" >/dev/null
            echo "ok  $f"
          done

      - name: setup_local_boot_template.rb behaviour
        run: ruby tests/test_setup_local_boot_template.rb
