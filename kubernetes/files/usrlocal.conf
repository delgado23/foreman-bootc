# /usr/local is symlinked to /var/usrlocal (writable) in the image, because the
# ostree deployment root is read-only and tooling (Helm, etc.) installs into
# /usr/local/bin at runtime. /var is reinitialized at first boot, so create the
# bin skeleton here on every boot (the installed binaries persist in /var).
d /var/usrlocal      0755 root root -
d /var/usrlocal/bin  0755 root root -
d /var/usrlocal/sbin 0755 root root -
